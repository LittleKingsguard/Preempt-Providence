name: Publish pre-release to GitHub Packages

on:
  push:
    tags:
      - 'v*-rc.*'
      - 'v*-beta.*'
      - 'v*-alpha.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@littlekingsguard'

      - run: npm ci

      # dist/ is gitignored; the demo-driven tests (fork-stress-data) import
      # ../dist/core/* — build it before running the suite in the clean clone.
      - run: npm run build

      - run: npm test
      - run: npm run typecheck

      - run: npm publish
        env:
          # setup-node writes the registry auth; the committed .npmrc
          # interpolates ${NODE_AUTH_TOKEN} for npm.pkg.github.com.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
